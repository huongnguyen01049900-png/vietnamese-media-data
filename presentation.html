ko:{title:'베트남 밖의 베트남어 미디어 데이터베이스',sub:'베트남어–한국어 이중언어 발표 • 신문·방송·잡지·단체 중심 • 크리에이터는 배경 통계만 제시',sl:'연구 범위',st:'기관형 미디어를 핵심 분석 단위로, 크리에이터는 보조 데이터로 사용',sx:'본 발표는 베트남 밖에서 운영되는 51개 주요 미디어와 11개 잡지/간행물을 중심으로 합니다. 개인 블로그·YouTuber·크리에이터는 개별 설명 대신 배경 통계로만 사용합니다.',chips:['베트남 외부','주요 미디어 51개','잡지/간행물 11개','크리에이터 88개: 통계만','행별 QA 미확정'],kpis:[['62','기관형 소스 & 잡지'],['51','주요 미디어 소스'],['11','잡지/간행물'],['88','크리에이터/블로그/YouTube: 통계만']],mt:'운영 모델별 분류',pt:'주요 미디어 상세 프로필',pn:'원문 링크, 시작 시점, 운영 주체, 주요 내용, 배포 방식, 업데이트 주기, 2026 상태를 함께 표시합니다.',search:'소스, 국가, 내용 검색…',mag:'해외 베트남어 잡지의 세 단계 발전',audio:'라디오 매거진과 팟캐스트',qa:'데이터 신뢰도와 QA 유의사항',fields:['시작 시점','운영/소유 주체','편집 책임자','주요 내용','배포 방식','업데이트/발행 주기','길이/발행 정보','자료를 읽는 관점'],open:'원문 열기 ↗'}};
var C={ 'Hoa Kỳ':'미국','Úc':'호주','Australia':'호주','Vương quốc Anh':'영국','Pháp':'프랑스','Nhật Bản':'일본','Hàn Quốc':'한국','Đài Loan':'대만','Trung Quốc':'중국','Canada':'캐나다','Cộng hòa Séc':'체코','New Zealand':'뉴질랜드','Ba Lan':'폴란드','Đức':'독일','Thái Lan':'태국','Quốc tế':'국제','Liên bang Nga':'러시아'};
var P=[['Việt Nam','베트남'],['Hoa Kỳ','미국'],['thế giới','세계'],['quốc tế','국제'],['chính trị','정치'],['xã hội','사회'],['nhân quyền','인권'],['kinh tế','경제'],['văn hóa','문화'],['đời sống','생활'],['cộng đồng','커뮤니티'],['pháp luật','법률'],['lao động','노동'],['giáo dục','교육'],['y tế','보건'],['văn học','문학'],['nghệ thuật','예술'],['phê bình','비평'],['tôn giáo','종교'],['Website','웹사이트'],['radio','라디오'],['Radio','라디오'],['podcast','팟캐스트'],['video','영상'],['social','SNS'],['mạng xã hội','SNS'],['báo in','인쇄 신문'],['hằng ngày','매일'],['hằng tuần','매주'],['Chưa xác minh','미확인'],['Active','활동 중'],['Historical','역사 자료'],['Stale','장기 미갱신']];
function e(s){return String(s||'').replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
function tr(s,k){s=String(s||'');if(lang==='vi')return s;if(k==='country'&&C[s])return C[s];P.forEach(function(x){s=s.split(x[0]).join(x[1])});return s}
function type(raw){raw=String(raw||'').toUpperCase();var vi=lang==='vi';if(raw.indexOf('PUB')>-1)return vi?'Truyền thông công cộng':'공영 미디어';if(raw.indexOf('STATE')>-1)return vi?'Truyền thông quốc tế/nhà nước tài trợ':'국제방송/공적 재원';if(raw.indexOf('COMM')>-1)return vi?'Báo/truyền thông cộng đồng':'베트남계 커뮤니티 미디어';if(raw.indexOf('NEWS')>-1)return vi?'Newsroom tư nhân/thương mại':'상업/민간 뉴스룸';if(raw.indexOf('IND')>-1)return vi?'Độc lập/tạp chí phân tích':'독립/분석 매체';if(raw.indexOf('NGO')>-1)return vi?'NGO/advocacy':'NGO/시민사회';if(raw.indexOf('REL')>-1)return vi?'Truyền thông tôn giáo':'종교 미디어';if(raw.indexOf('ASSOC')>-1)return vi?'Hội đoàn/portal cộng đồng':'협회/커뮤니티 포털';if(raw.indexOf('GOV')>-1)return vi?'Nguồn chính phủ/cơ quan ngoại giao':'정부/외교 소스';return raw}
function grp(raw){raw=String(raw||'').toUpperCase();if(raw.indexOf('PUB')>-1||raw.indexOf('STATE')>-1)return'A';if(raw.indexOf('COMM')>-1||raw.indexOf('NEWS')>-1)return'B';return'C'}
function orient(raw){var g=grp(raw);if(lang==='vi')return g==='A'?'Đọc theo mô hình public service/quốc tế và ghi rõ quốc gia chủ quản, cơ quan tài trợ.':g==='B'?'Đọc trong bối cảnh cộng đồng người Việt ở nước sở tại và mô hình newsroom địa phương.':'Đọc theo chức năng tổ chức; không mặc định NGO, tôn giáo, hội đoàn hay nguồn chính phủ là newsroom.';return g==='A'?'공영/국제방송 구조로 읽고 관할 국가와 재원 구조를 명확히 봅니다.':g==='B'?'거주국 베트남계 공동체와 지역 뉴스룸의 기능을 중심으로 봅니다.':'조직 기능에 따라 읽고 NGO·종교·협회·정부 소스를 일반 뉴스룸과 동일시하지 않습니다.'}
function orig(v){if(!v)return'—';var x=tr(v);return lang==='ko'&&x!==v?e(x)+'<span class="orig">VN: '+e(v)+'</span>':e(v)}
function url(s){s=String(s||'');return /^https?:\/\//i.test(s)?s:'https://'+s}
function models(){var a=lang==='vi'?[['PUB','Truyền thông công cộng','Public service; chú ý quốc gia chủ quản.'],['STATE','Truyền thông quốc tế/nhà nước tài trợ','Ghi rõ cơ quan chủ quản/tài trợ.'],['COMM','Báo/truyền thông cộng đồng','Phục vụ cộng đồng Việt ở nước sở tại.'],['NEWS','Newsroom thương mại/tư nhân','Phân biệt công ty truyền thông với cơ quan công quyền.'],['IND','Độc lập/tạp chí phân tích','Góc nhìn riêng; cần đối chiếu.'],['NGO/REL/ASSOC/GOV','Tổ chức xã hội, tôn giáo, hội đoàn, chính phủ','Không xếp ngang newsroom nếu chức năng khác.']]:[['PUB','공영 미디어','공공서비스 성격과 관할 국가를 함께 봅니다.'],['STATE','국제방송/공적 재원','운영 기관과 재원·감독 구조를 명시합니다.'],['COMM','커뮤니티 미디어','거주국 베트남계 공동체 맥락에서 읽습니다.'],['NEWS','상업/민간 뉴스룸','민간 미디어 기업과 공공기관을 구분합니다.'],['IND','독립/분석 매체','고유 관점이 있으므로 교차 검증합니다.'],['NGO/REL/ASSOC/GOV','시민단체·종교·협회·정부','일반 뉴스룸으로 동일시하지 않습니다.']];document.getElementById('models').innerHTML=a.map(function(x){return'<article><h3>'+e(x[0]+' · '+x[1])+'</h3><p>'+e(x[2])+'</p></article>'}).join('')}
function card(r,i){var f=T[lang].fields, raw=r['Loại hình gốc']||'', link=r['Website chính']||r['Nguồn chính/official']||'';var vals=[r['Năm/ngày thành lập hoặc số đầu'],r['Chủ sở hữu/Cơ quan chủ quản'],r['Tổng biên tập/Người phụ trách'],r['Nội dung chính'],r['Hình thức phát hành/phân phối'],r['Tần suất/lịch cập nhật hiện nay'],r['Độ dài video/audio/podcast']];var dl='';vals.forEach(function(v,n){dl+='<dt>'+e(f[n])+'</dt><dd>'+orig(v)+'</dd>'});dl+='<dt>'+e(f[7])+'</dt><dd>'+e(orient(raw))+'</dd>';return'<article class="pcard" data-g="'+grp(raw)+'"><h3>'+e(r['Tên nguồn'])+'</h3><div class="meta2">'+e(tr(r['Quốc gia/Thị trường'],'country'))+' · '+e(type(raw))+' · '+e(tr(r['Trạng thái 2026']))+'</div><dl>'+dl+'</dl><p class="muted2">'+e(r['Ghi chú/xung đột']||'')+'</p>'+(link?'<a class="button secondary compact" target="_blank" rel="noopener" href="'+e(url(link))+'">'+e(T[lang].open)+'</a>':'')+'</article>'}
