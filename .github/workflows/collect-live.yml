name: Collect live media feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: ["main"]
    paths:
      - 'config/sources.json'
      - 'scripts/collect_live.py'
      - '.github/workflows/collect-live.yml'

permissions:
  contents: write

concurrency:
  group: live-media-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Collect feeds
        run: python scripts/collect_live.py

      - name: Commit updated live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live data/history
          if git diff --cached --quiet; then
            echo "No live-data changes"
          else
            git commit -m "data: refresh live media feeds"
            git pull --rebase origin main
            git push origin main
          fi
